[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "18.18.0"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

[[redirects]]
  from = "/api/nonce"
  to = "/.netlify/functions/nonce"
  status = 200

[[redirects]]
  from = "/api/message"
  to = "/.netlify/functions/message"
  status = 200

[[redirects]]
  from = "/api/chat-bootstrap"
  to = "/.netlify/functions/chat-bootstrap"
  status = 200

[[redirects]]
  from = "/api/communityVoting"
  to = "/.netlify/functions/communityVoting"
  status = 200

[[redirects]]
  from = "/api/admin/communityVoting"
  to = "/.netlify/functions/admin-communityVoting"
  status = 200

[[redirects]]
  from = "/api/admin/editMessage"
  to = "/.netlify/functions/admin-editMessage"
  status = 200

[[redirects]]
  from = "/api/admin/updateRules"
  to = "/.netlify/functions/admin-updateRules"
  status = 200

[[redirects]]
  from = "/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/app"
  to = "/"
  status = 302
  force = true

[[redirects]]
  from = "/app/"
  to = "/"
  status = 302
  force = true

