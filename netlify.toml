[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20.19.0"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

[[redirects]]
  from = "/docs/biggieyes"
  to = "/app/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/api/nonce"
  to = "/.netlify/functions/nonce"
  status = 200

[[redirects]]
  from = "/api/message"
  to = "/.netlify/functions/message"
  status = 200

[[redirects]]
  from = "/api/chat-bootstrap"
  to = "/.netlify/functions/chat-bootstrap"
  status = 200

[[redirects]]
  from = "/api/communityVoting"
  to = "/.netlify/functions/communityVoting"
  status = 200

[[redirects]]
  from = "/api/admin/communityVoting"
  to = "/.netlify/functions/admin-communityVoting"
  status = 200

[[redirects]]
  from = "/api/admin/editMessage"
  to = "/.netlify/functions/admin-editMessage"
  status = 200

[[redirects]]
  from = "/api/admin/updateRules"
  to = "/.netlify/functions/admin-updateRules"
  status = 200

[[redirects]]
  from = "/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Origin-Agent-Cluster = "?1"
    X-Permitted-Cross-Domain-Policies = "none"
    X-XSS-Protection = "0"
