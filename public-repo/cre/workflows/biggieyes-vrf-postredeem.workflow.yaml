name: biggieyes-vrf-postredeem-monitor
version: 0.1.0
description: >
  CRE workflow skeleton for post-redeem monitoring.
  It combines a Polygon mainnet on-chain VRF signal with one external API signal.

metadata:
  project: BiggiEyes
  network: polygon-mainnet
  chain_id: 137

env:
  POLYGON_RPC_URL: ${POLYGON_RPC_URL}
  VRF_ROUTER_ADDRESS: ${VRF_ROUTER_ADDRESS}
  EXTERNAL_SIGNAL_URL: ${EXTERNAL_SIGNAL_URL}

triggers:
  - id: vrf_fulfill_started
    type: onchain_event
    chain: polygon-mainnet
    rpc_url: ${POLYGON_RPC_URL}
    contract: ${VRF_ROUTER_ADDRESS}
    event: VRFFulfillStarted(uint256,address)

steps:
  - id: read_request
    type: contract_read
    chain: polygon-mainnet
    contract: ${VRF_ROUTER_ADDRESS}
    function: getRequest
    args:
      - "{{ trigger.args.0 }}"

  - id: fetch_external_signal
    type: http_request
    request:
      method: GET
      url: ${EXTERNAL_SIGNAL_URL}

  - id: evaluate
    type: decision
    expression: |
      return {
        requestId: trigger.args.0,
        fulfilled: steps.read_request.output.fulfilled === true,
        externalOk: steps.fetch_external_signal.status >= 200 && steps.fetch_external_signal.status < 300,
      };

  - id: report
    type: log
    message: |
      CRE monitor verdict:
      requestId={{ steps.evaluate.output.requestId }}
      fulfilled={{ steps.evaluate.output.fulfilled }}
      externalOk={{ steps.evaluate.output.externalOk }}

outputs:
  request_id: "{{ steps.evaluate.output.requestId }}"
  fulfilled: "{{ steps.evaluate.output.fulfilled }}"
  external_ok: "{{ steps.evaluate.output.externalOk }}"
