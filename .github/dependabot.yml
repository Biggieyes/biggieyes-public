version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /biggi-project/bekend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /public-repo
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types:
          - patch
          - minor
