name: CI

on:
  push:
    branches: [ main, 'feature/**', 'pull/**' ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install deps
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: ABI checks
        run: npm run check:abis
      - name: Contract checks
        run: npm run check:contracts
      - name: Build
        run: npm run build
