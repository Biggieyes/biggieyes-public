name: Secret Scan

on:
  push:
    branches: [ main, 'feature/**', 'pull/**', 'release/**' ]
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Run secret scanner
        run: npm run security:secrets
