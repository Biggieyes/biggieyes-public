name: RPC Health

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.19
      - name: Install deps
        run: npm ci
      - name: Check RPC health
        run: node scripts/check-rpc-health.mjs
        env:
          VITE_JSON_RPC_URL: ${{ secrets.VITE_JSON_RPC_URL }}
          VITE_POLYGON_RPC_URL: ${{ secrets.VITE_POLYGON_RPC_URL }}
          VITE_RPC_URL_POLYGON: ${{ secrets.VITE_RPC_URL_POLYGON }}
          VITE_RPC_URL_ACTIVE_CHAIN: ${{ secrets.VITE_RPC_URL_ACTIVE_CHAIN }}
          VITE_MAINNET_RPC_URL: ${{ secrets.VITE_MAINNET_RPC_URL }}
          VITE_MOD_CHAIN_RPC: ${{ secrets.VITE_MOD_CHAIN_RPC }}
          VITE_ADDITIONAL_RPC_URLS: ${{ secrets.VITE_ADDITIONAL_RPC_URLS }}
          VITE_INFURA_PROJECT_ID: ${{ secrets.VITE_INFURA_PROJECT_ID }}
          VITE_ARCHIVE_RPC_URL: ${{ secrets.VITE_ARCHIVE_RPC_URL }}
          VITE_ARCHIVE_RPC_URLS: ${{ secrets.VITE_ARCHIVE_RPC_URLS }}
          VITE_RPC_HEALTH_TIMEOUT_MS: ${{ secrets.VITE_RPC_HEALTH_TIMEOUT_MS }}
          VITE_RPC_MAX_STALE_BLOCKS: ${{ secrets.VITE_RPC_MAX_STALE_BLOCKS }}
          RPC_EXPECTED_CHAIN_ID: ${{ secrets.RPC_EXPECTED_CHAIN_ID }}
          RPC_HEALTH_STRICT: ${{ secrets.RPC_HEALTH_STRICT }}
          RPC_HEALTH_INCLUDE_ARCHIVE: ${{ secrets.RPC_HEALTH_INCLUDE_ARCHIVE }}
          RPC_HEALTH_MIN_HEALTHY: "2"
