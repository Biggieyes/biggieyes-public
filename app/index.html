    <style>
      [data-defer] {
        content-visibility: auto;
        contain-intrinsic-size: 1px 300px;
      }
      :root {
        --vh: 1vh;
      }
      .full-bg {
        min-height: calc(var(--vh, 1vh) * 100);
      }
      body {
        opacity: 1;
        transition: opacity 0.5s;
      }
      body.loaded {
        opacity: 1;
      }
    </style>

  <body>
    <noscript>BiggiEyes requires JavaScript to be enabled.</noscript>
    <div id="root"></div>

    <script>
      (function () {
        const GATEWAYS = [
          "https://cloudflare-ipfs.com/ipfs/",
          "https://ipfs.io/ipfs/",
          "https://gateway.pinata.cloud/ipfs/",
          "https://dweb.link/ipfs/",
        ];

        const CRITICAL_IMAGE_CONTAINERS = [
          ".above-the-fold",
          ".top-bar",
          ".wallet-row",
          ".widget-center-wrapper",
          ".left-block",
          ".right-logo-group",
          ".panel-nav",
          ".mobile-actions",
        ].join(", ");

        function ipfsToHttp(src) {
          if (!src || typeof src !== "string") return src;
          if (src.startsWith("ipfs://")) {
            const cid = src.replace("ipfs://", "");
            return GATEWAYS[0] + cid;
          }
          return src;
        }

        function isCriticalImage(img) {
          if (!img) return false;
          return Boolean(img.closest(CRITICAL_IMAGE_CONTAINERS));
        }

        function tuneImage(img) {
          if (!img || img.dataset.tuned) return;
          img.dataset.tuned = "1";

          if (img.src && img.src.startsWith("ipfs://"))
            img.src = ipfsToHttp(img.src);

          const srcAttr = img.getAttribute("src");
          if (srcAttr && srcAttr.startsWith("ipfs://")) {
            img.setAttribute("src", ipfsToHttp(srcAttr));
          }

          if (isCriticalImage(img)) {
            if (!img.hasAttribute("loading"))
              img.setAttribute("loading", "eager");
            if (!img.hasAttribute("decoding"))
              img.setAttribute("decoding", "async");
            if (!img.hasAttribute("fetchPriority")) {
              img.setAttribute("fetchPriority", "high");
            }
          } else {
            if (!img.hasAttribute("loading"))
              img.setAttribute("loading", "lazy");
            if (!img.hasAttribute("decoding"))
              img.setAttribute("decoding", "async");
            if (!img.hasAttribute("fetchPriority")) {
              img.setAttribute("fetchPriority", "low");
            }
          }

          if (!img.hasAttribute("width") && img.dataset.w) {
            img.setAttribute("width", img.dataset.w);
          }
          if (!img.hasAttribute("height") && img.dataset.h) {
            img.setAttribute("height", img.dataset.h);
          }
        }

        Array.prototype.forEach.call(document.images || [], tuneImage);

        const mo = new MutationObserver((muts) => {
          for (const m of muts) {
            for (const n of m.addedNodes) {
              if (n.nodeType !== 1) continue;
              if (n.tagName === "IMG") tuneImage(n);
              const imgs = n.querySelectorAll ? n.querySelectorAll("img") : [];
              imgs.forEach(tuneImage);
            }
          }
        });
        mo.observe(document.documentElement, {
          childList: true,
          subtree: true,
        });

        window.addEventListener(
          "error",
          (e) => {
            const img = e.target;
            if (!(img instanceof HTMLImageElement)) return;
            const src = img.getAttribute("src") || "";
            if (!src.includes("/ipfs/")) return;
            const idx = GATEWAYS.findIndex((g) => src.startsWith(g));
            const next = GATEWAYS[(idx + 1) % GATEWAYS.length];
            if (next && idx !== -1) {
              const cid = src.replace(GATEWAYS[idx], "");
              img.src = next + cid;
            }
          },
          true,
        );

        const setVh = () => {
          document.documentElement.style.setProperty(
            "--vh",
            window.innerHeight * 0.01 + "px",
          );
        };
        setVh();
        window.addEventListener("resize", setVh);

        window.addEventListener("DOMContentLoaded", () =>
          document.body.classList.add("loaded"),
        );
      })();
    </script>
